<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ندى — واجهة بحث بسيطة للعثور على ما تبحث عنه على الإنترنت.">
  <title>ندى — بحث الإنترنت</title>
  <style>
    :root { color-scheme: light; --text:#202124; --muted:#5f6368; --line:#dfe1e5; --hover:#f8f9fa; --blue:#4285f4; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:Arial,"Noto Sans Arabic",Tahoma,sans-serif; color:var(--text); }
    body { min-height:100vh; display:flex; flex-direction:column; }
    a { color:inherit; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; font-size:14px; gap:20px; }
    .top-left,.top-right { display:flex; align-items:center; gap:22px; }
    .avatar { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; color:white; background:#4285f4; font-size:17px; }
    .apps { width:24px; height:24px; display:grid; grid-template-columns:repeat(3,5px); grid-template-rows:repeat(3,5px); gap:3px; place-content:center; }
    .apps i { background:#5f6368; border-radius:50%; }
    main { flex:1; display:flex; flex-direction:column; align-items:center; padding: min(11vh,100px) 20px 70px; }
    .logo { font-size:clamp(66px,10vw,100px); line-height:1.25; font-weight:700; letter-spacing:-5px; margin:0 0 27px; user-select:none; }
    .logo span:nth-child(1) { color:#4285f4; }.logo span:nth-child(2) { color:#ea4335; }.logo span:nth-child(3) { color:#fbbc05; }
    .search-form { width:min(584px,94vw); }
    .searchbox { width:100%; height:48px; border:1px solid var(--line); border-radius:28px; display:flex; align-items:center; gap:12px; padding:0 16px; }
    .searchbox:hover,.searchbox:focus-within { box-shadow:0 1px 6px #20212433; border-color:transparent; }
    .search-icon { flex:none; width:20px; height:20px; color:#5f6368; }
    input { flex:1; min-width:0; border:0; outline:0; font:16px Arial,Tahoma,sans-serif; background:transparent; color:var(--text); }
    .buttons { display:flex; justify-content:center; gap:12px; margin-top:28px; }
    button { border:1px solid transparent; border-radius:4px; background:#f8f9fa; color:#3c4043; font:14px Arial,Tahoma,sans-serif; padding:10px 18px; cursor:pointer; min-height:38px; }
    button:hover { border-color:#dadce0; box-shadow:0 1px 1px #00000012; }
    .language { font-size:13px; margin-top:28px; color:#3c4043; }
    .language a { color:#1a73e8; margin-right:8px; }
    footer { background:#f2f2f2; color:#70757a; font-size:14px; }
    .country { padding:15px 30px; border-bottom:1px solid #dadce0; }
    .footer-links { display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px 30px; padding:15px 30px; }
    .footer-group { display:flex; flex-wrap:wrap; gap:22px; }
    @media(max-width:600px) { .topbar{padding:16px;}.top-left,.top-right{gap:13px}.topbar{font-size:13px} main{padding-top:11vh}.logo{margin-bottom:30px}.footer-links{justify-content:center;padding:16px}.footer-group{justify-content:center;gap:16px}.country{text-align:center} }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="top-left" aria-label="روابط سريعة">
      <a href="https://www.google.com/imghp?hl=ar" target="_blank" rel="noopener">صور</a>
      <a href="https://mail.google.com/" target="_blank" rel="noopener">Gmail</a>
      <a class="apps" href="https://www.google.com/intl/ar/about/products" aria-label="تطبيقات" target="_blank" rel="noopener"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></a>
      <a class="avatar" href="https://accounts.google.com/" aria-label="الحساب" target="_blank" rel="noopener">ن</a>
    </nav>
    <nav class="top-right" aria-label="روابط ندى">
      <a href="#about">حول ندى</a><a href="#store">متجر ندى</a>
    </nav>
  </header>
  <main>
    <h1 class="logo" aria-label="ندى"><span>ن</span><span>د</span><span>ى</span></h1>
    <form class="search-form" id="searchForm" action="https://www.google.com/search" method="get">
      <div class="searchbox">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input id="q" type="search" name="q" autocomplete="off" aria-label="ابحث في الإنترنت" autofocus>
      </div>
      <div class="buttons">
        <button type="submit">بحث ندى</button>
        <button type="button" id="lucky">ضربة حظ</button>
      </div>
    </form>
    <div class="language">يقدّم ندى البحث على الإنترنت بسهولة <a href="https://www.google.com/?hl=en">English</a></div>
  </main>
  <footer>
    <div class="country">مصر</div>
    <div class="footer-links">
      <div class="footer-group"><a href="#about">حول ندى</a><a href="#business">الأعمال</a><a href="#ads">الإعلانات</a></div>
      <div class="footer-group"><a href="#privacy">الخصوصية</a><a href="#terms">البنود</a><a href="#settings">الإعدادات</a></div>
    </div>
  </footer>
  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('q');
    document.getElementById('lucky').addEventListener('click', () => {
      const query = input.value.trim();
      if (!query) { input.focus(); return; }
      window.location.href = 'https://www.google.com/search?btnI=1&q=' + encodeURIComponent(query);
    });
    form.addEventListener('submit', (event) => {
      if (!input.value.trim()) { event.preventDefault(); input.focus(); }
    });
  </script>
</body>
</html>
